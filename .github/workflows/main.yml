name: CI/CD using GitHub Actions & Docker

on:
  push:
    branches:
      - "feat/cicd/docker"

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository code (GitHub 레포지토리의 코드를 체크아웃)
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Set up JDK 17 (Java 17 설치 및 설정)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3️⃣ Cache Gradle dependencies (Gradle 의존성 캐시)
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4️⃣ Gradle Wrapper 실행 권한 부여 (gradlew 실행 권한 추가)
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5️⃣ Build the project using Gradle (Gradle로 프로젝트 빌드)
      - name: Build with Gradle
        run: ./gradlew build -x test

      # 6️⃣ Docker Compose Build and Push (Docker 이미지 빌드 및 푸시)
      - name: Build and Push Docker Images
        if: contains(github.ref, 'dev') || contains(github.ref, 'main')
        run: |
          docker-compose -f docker-compose.yml build common eureka-server config-server gateway-service notification-service user-service booking-service payment-service flight-service ticket-service
          docker-compose -f docker-compose.yml push common eureka-server config-server gateway-service notification-service user-service booking-service payment-service flight-service ticket-service

      # 7️⃣ Deploy to dev environment (개발 서버에 배포 - 주석 처리됨)
      # - name: Deploy to dev
