name: CI/CD using GitHub Actions & Docker

on:
  push:
    branches:
      - "feat/cicd/docker"

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3️⃣ Cache Gradle dependencies
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4️⃣ Gradle Wrapper 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5️⃣ Run Tests (테스트 실행)
      - name: Run Tests
        run: ./gradlew test

      # 6️⃣ Build the project using Gradle (테스트 포함 빌드)
      - name: Build with Gradle
        run: ./gradlew build

      # 7️⃣ DockerHub 로그인
      - name: DockerHub Login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # 8️⃣ Docker 이미지 빌드 및 푸시
      - name: Build and Push Docker Images
        if: contains(github.ref, 'dev') || contains(github.ref, 'main')
        run: |
          docker-compose -f docker-compose.yml build eureka-server config-server gateway-service notification-service user-service booking-service payment-service flight-service ticket-service
          docker-compose -f docker-compose.yml push eureka-server config-server gateway-service notification-service user-service booking-service payment-service flight-service ticket-service

      # 9️⃣ Deploy to dev environment (개발 서버에 배포 - 주석 처리됨)
