name: CI/CD using GitHub Actions & Docker

on:
  push:
    branches:
      - "feat/cicd/action"

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 레포지토리 코드 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      # 3️⃣ Gradle 의존성 캐시
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4️⃣ Gradle Wrapper 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5️⃣ Gradle 빌드 (테스트 제외)
      - name: Build with Gradle (No Tests)
        run: ./gradlew build -x test  # ✅ 테스트 제외하고 빌드

      # 6️⃣ 테스트 실행
      - name: Run Tests
        run: ./gradlew test  # ✅ 빌드 후 테스트 실행

      # 7️⃣ DockerHub 로그인
      - name: DockerHub Login
        if: contains(github.ref, 'dev') || contains(github.ref, 'main')
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # 8️⃣ Docker 이미지 빌드 및 푸시
      - name: Build and Push Docker Images
        if: contains(github.ref, 'dev') || contains(github.ref, 'main')
        run: |
          IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)
          docker-compose -f docker-compose.yml build --build-arg VERSION=$IMAGE_TAG eureka-server config-server gateway-service notification-service user-service booking-service payment-service flight-service ticket-service
          docker-compose -f docker-compose.yml push eureka-server config-server gateway-service notification-service user-service booking-service payment-service flight-service ticket-service

