server:
  port: 8100  # User 서비스 고정 포트

spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://config-server:8888
  cloud:
    config:
      discovery:
        enabled: true  # Eureka를 통해 Config Server 검색
        service-id: config-server



eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
