server:
  port: 8120

spring:
  application:
    name: booking-service
  config:
    import: optional:configserver:http://config-server:8888
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
