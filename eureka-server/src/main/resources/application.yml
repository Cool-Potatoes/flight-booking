server:
  port: 8761

spring:
  application:
    name: eureka-server


management:
  endpoints:
    web:
      exposure:
        include: ["health", "info", "prometheus"]  # 프로메테우스로만 볼꺼라 다르 엔드포인트는 없어도 될듯싶은
  endpoint: # 빼도 됨
    health:
      show-details: always  # 헬스 체크 상세 정보 제공

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

  server:
    enableSelfPreservation: false # TODO 배포시 TRUE로

