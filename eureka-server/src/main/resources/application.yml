server:
  port: 8761

spring:
  application:
    name: eureka-server


management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}

  server:
    enableSelfPreservation: true