server:
  port: 8761

spring:
  application:
    name: eureka-server


management:
  endpoints:
    web:
      exposure:
        include: ["health", "info", "prometheus"]
  endpoint:
    health:
      show-details: always  # 헬스 체크 상세 정보 제공

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

  server:
    enableSelfPreservation: false #배포시 TRUE로

logging:
  level:
    com.netflix.discovery: DEBUG # 배포시 INFO로
