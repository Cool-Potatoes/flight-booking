global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1️⃣ Eureka Server 모니터링
  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eureka-server:8761']

  # 2️⃣ Config Server 모니터링
  - job_name: 'config-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['config-server:8888']

  # 3️⃣ Gateway Service 모니터링
  - job_name: 'gateway-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway-service:8080']

  # 4️⃣ User Service 모니터링
  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['user-service:8100']

  # 5️⃣ Notification Service 모니터링
  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification-service:8160']

  # 6️⃣ Payment Service 모니터링
  - job_name: 'payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-service:8130']

  # 7️⃣ Flight Service 모니터링
  - job_name: 'flight-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['flight-service:8150']

  # 8️⃣ Booking Service 모니터링
  - job_name: 'booking-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['booking-service:8120']

  # 9️⃣ Ticket Service 모니터링
  - job_name: 'ticket-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ticket-service:8170']

  # 🔟 Kafka 상태 모니터링 (Exporter 사용 X)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']

  # 11️⃣ Zookeeper 상태 모니터링 (Exporter 사용 X)
  - job_name: 'zookeeper'
    static_configs:
      - targets: ['zookeeper:2181']

  # 12️⃣ Redis 상태 모니터링 (Exporter 사용 X)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Zipkin 메트릭 수집 (상태 확인)
  - job_name: 'zipkin'
    static_configs:
      - targets: [ 'zipkin:9411' ]

  # Kafka UI 상태 모니터링 (상태만 확인)
  - job_name: 'kafka-ui'
    static_configs:
      - targets: [ 'kafka-ui:9095' ]