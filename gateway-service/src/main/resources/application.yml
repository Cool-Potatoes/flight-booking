server:
  port: 0  # Gateway 서비스는 일반적으로 8080 포트를 사용

spring:
  application:
    name: gateway-service
  config:
    import: "optional:configserver:"  # Config Server에서 설정 불러오기
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus  # Actuator 헬스체크 및 모니터링

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    hostname: ${HOSTNAME}
    prefer-ip-address: true  # IP 기반 서비스 등록
