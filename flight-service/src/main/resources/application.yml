server:
  port: 8150  # flight-service는 8150 포트 사용

spring:
  application:
    name: flight-service
  config:
    import: optional:configserver:http://config-server:8888
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server

management:
  tracing:
    sampling:
      probability: 1.0  # 전체 트레이싱 활성화
    zipkin:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: prometheus


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}

