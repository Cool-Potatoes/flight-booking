server:
  port: 8888

spring:
  application:
    name: config-server
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  cloud:
    config:
      server:
        git:
          uri: ${SPRING_CLOUD_CONFIG_SERVER_GIT_URI}
          username: ${SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME}
          password: ${SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD}
          default-label: dev
          search-paths: '{application}'
          clone-on-start: true
          basedir: /tmp/config-repo
          skip-ssl-validation: true

  zipkin:
    base-url: http://zipkin:9411  # Zipkin 서버 URL (Docker에서는 컨테이너 이름 사용)

  sleuth:
    sampler:
      probability: 1.0  # 모든 요청 추적

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info
