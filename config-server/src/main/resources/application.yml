server:
  port: 8888

spring:
  profiles:
    active: git  # 'git' 프로파일을 활성화 (선택사항)
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Cool-Potatoes/config-repo.git
          username: HanBeom98
          password: ${SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD}
          default-label: main
          search-paths: '{application}'  # 애플리케이션 이름에 맞는 설정 파일을 찾음
          clone-on-start: true
          skip-ssl-validation: true
management:
  tracing:
    sampling:
      probability: 1.0  # 전체 트레이싱 활성화
  endpoints:
    web:
      exposure:
        include: prometheus
  endpoint:
    health:
      show-details: always


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}

