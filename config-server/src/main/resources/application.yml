server:
  port: 8888

spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Cool-Potatoes/flight-booking
          username: Hanbeom98
          password: ${SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD}
          default-label: dev
          search-paths: 'config-server/src/main/resources/config-repo'  # 이곳에 설정할 리포지토리 내 경로 입력
          clone-on-start: true
          basedir: /tmp/config-repo
          skip-ssl-validation: true

management:
  tracing:
    sampling:
      probability: 1.0  # 모든 요청 추적
    zipkin:
      endpoint: http://zipkin:9411/api/v2/spans  # ✅ 최신 Zipkin 엔드포인트 적용
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    hostname: ${HOSTNAME:localhost}
    prefer-ip-address: true
