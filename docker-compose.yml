

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  prometheus_data:
  grafana_data:

services:
  x-common-settings: &common-settings
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M

  # 1️⃣ Eureka Server
  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - app-network
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    env_file:
      - .env.prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    <<: *common-settings

  # 2️⃣ Config Server
  config-server:
    build:
      context: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - app-network
    env_file:
      - .env.prod
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://config-server:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    <<: *common-settings
  # 3️⃣ Gateway Service
  gateway-service:
    build:
      context: ./gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    networks:
      - app-network
    env_file:
      - .env.prod
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "echo 'Checking health check'; sleep 10 && curl -f http://gateway-service:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 20s
      retries: 5
    <<: *common-settings
  # 4️⃣ Zookeeper
  # 1️⃣ Zookeeper 서버 1
  zookeeper:
    image: wurstmeister/zookeeper:latest
    platform: linux/amd64
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - app-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *common-settings
  # 5️⃣ Kafka
  kafka:
    image: wurstmeister/kafka:latest
    platform: linux/amd64
    container_name: kafka
    ports:
      - "9092:9092"
    networks:
      - app-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    <<: *common-settings
  # 6️⃣ Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    platform: linux/amd64
    container_name: kafka-ui
    ports:
      - "9095:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_READONLY: "false"
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
      zookeeper:
        condition: service_healthy

  # 7️⃣ Redis
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    env_file:
      - .env.prod
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *common-settings
  # 8️⃣ PostgreSQL (단일 데이터베이스)
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: systempass
      POSTGRES_DB: flight_booking
    ports:
      - "5432:5432"
    networks:
      - app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    <<: *common-settings
  # 9️⃣ Zipkin
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - app-network
    <<: *common-settings

  # 🔟 Prometheus
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    networks:
      - app-network
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
    <<: *common-settings
  # 11️⃣ Grafana
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - app-network
    volumes:
      - grafana_data:/var/lib/grafana
      - ./datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 5
    <<: *common-settings
  # 12️⃣ User Service
  user-service:
    build:
      context: ./user-service
    container_name: user-service
    ports:
      - "8100:8100"
    networks:
      - app-network
    env_file:
      - .env.prod
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    <<: *common-settings
  # 13️⃣ Ticket Service
  ticket-service:
    build:
      context: ./ticket-service
    container_name: ticket-service
    ports:
      - "8170:8170"
    networks:
      - app-network
    env_file:
      - .env.prod
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    <<: *common-settings
  # 14️⃣ Notification Service
  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    ports:
      - "8160:8160"
    networks:
      - app-network
    env_file:
      - .env.prod
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    <<: *common-settings
  # 15️⃣ Payment Service
  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    ports:
      - "8130:8130"
    networks:
      - app-network
    env_file:
      - .env.prod
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy

  # 16️⃣ Booking Service
  booking-service:
    build:
      context: ./booking-service
    container_name: booking-service
    ports:
      - "8120:8120"
    networks:
      - app-network
    env_file:
      - .env.prod
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    <<: *common-settings
  # 17️⃣ Flight Service
  flight-service:
    build:
      context: ./flight-service
    container_name: flight-service
    ports:
      - "8150:8150"
    networks:
      - app-network
    env_file:
      - .env.prod
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    <<: *common-settings